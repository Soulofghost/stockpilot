version: '3.8'

services:
  stockpilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockpilot-wms
    ports:
      - "8006:8006"
    environment:
      - PORT=8006
      - STOCKPILOT_DB=/app/backend/data/stockpilot.db
    volumes:
      - wms_data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8006/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  wms_data:
    driver: local
